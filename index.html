<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정석진 이력서</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        h1 { color: #e94560; text-align: center; margin-bottom: 30px; font-size: 2em; }
        .pdf-viewer {
            width: 100%;
            height: 85vh;
            border: 2px solid #e94560;
            border-radius: 8px;
        }
        .download-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #e94560;
            text-decoration: none;
            font-size: 1.1em;
        }
        .download-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>정석진 이력서</h1>
        <iframe class="pdf-viewer" src="resume6.pdf"></iframe>
        <a class="download-link" href="resume6.pdf" download>PDF 다운로드</a>
    </div>
</body>
</html>
